<!DOCTYPE html>
<html>

<head>
    <title>Notepad</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sceditor@3/minified/themes/defaultdark.min.css" />
    <style>
        :root {
            --glass-dark: rgba(10, 10, 10, 0.88);
            --border: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        #editor {
            width: 100%;
            height: 100%;
        }

        .sceditor-container {
            background: transparent !important;
            border: none !important;
        }

        .sceditor-container iframe,
        .sceditor-container textarea {
            background: transparent !important;
        }

        .sceditor-toolbar {
            background: var(--glass-dark) !important;
            border-bottom: none !important;
            display: flex;
            justify-content: center;
            position: relative;
            height: 35px;
        }

        div.sceditor-group {
            background: var(--border);
            border-bottom: 1px solid #000;
        }

        .sceditor-container iframe {
            border: none !important;
        }

        .sceditor-toolbar div {
            display: flex;
        }

        .sceditor-toolbar .sceditor-group {
            display: inline-block;
        }

        .sceditor-toolbar .sceditor-group:first-child {
            position: absolute;
            left: 5px;
        }

        .sceditor-toolbar .sceditor-group:nth-child(2) {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .sceditor-toolbar .sceditor-group:last-child {
            position: absolute;
            right: 1px;
        }
    </style>
</head>

<body>
    <div id="toolbar"></div>
    <textarea id="editor"></textarea>

    <script src="https://cdn.jsdelivr.net/npm/sceditor@3/minified/sceditor.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sceditor@3/minified/formats/bbcode.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            sceditor.create(document.getElementById('editor'), {
                format: 'bbcode',
                plugins: 'undo',
                style: 'https://kylekart.github.io/webtop/applications/note/styles.css',
                toolbarContainer: document.getElementById("toolbar"),

                toolbar: 'cut,copy,paste,pastetext|bold,italic,underline,strike,subscript,superscript,font,size,color,left,center,right,justify,removeformat|source',

                width: '100%',
                height: '100%',
                emoticonsEnabled: false,
                autoExpand: true,
                resizeEnabled: false,
            });
        });
    </script>

</body>

</html>
