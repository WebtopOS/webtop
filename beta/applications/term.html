<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webtop Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <style>
        body { background: #000; margin: 0; padding: 20px; }
        #terminal { width: 100%; height: 90vh; }
    </style>
</head>
<body>
    <div id="terminal"></div>

    <script>
        const term = new Terminal({
            theme: { background: '#000', foreground: '#00ff00' },
            fontFamily: 'monospace',
            cursorBlink: true
        });

        term.open(document.getElementById('terminal'));
        term.writeln('Welcome to Webtop Terminal (xterm.js edition)');
        term.write('> ');

        let currentInput = '';

        term.onData(e => {
            switch (e) {
                case '\r':
                    term.writeln('');
                    handleCommand(currentInput);
                    currentInput = '';
                    term.write('> ');
                    break;
                case '\u007F':
                    if (currentInput.length > 0) {
                        term.write('\b \b');
                        currentInput = currentInput.slice(0, -1);
                    }
                    break;
                default:
                    term.write(e);
                    currentInput += e;
            }
        });

        function handleCommand(cmd) {
            const trimmed = cmd.trim();
            if (trimmed === 'clear') {
                term.clear();
            } else if (trimmed === 'about') {
                term.writeln('Webtop Terminal v1.0 (powered by xterm.js)');
            } else if (trimmed) {
                term.writeln(`'${trimmed}' is not recognized.`);
            }
        }
    </script>
</body>
</html>
