<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Webtop Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>

    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
        }

        #terminal {
            width: 100vw;
            height: 100vh;
            padding: 12px;
            box-sizing: border-box;
        }

        .xterm,
        .xterm-viewport,
        .xterm-screen {
            background-color: transparent !important;
        }

        .xterm-viewport {
            overflow-y: auto !important;
            scrollbar-width: none;
        }

        .xterm-viewport::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>

    <div id="terminal"></div>

    <script>
        const term = new Terminal({
            allowTransparency: true,
            theme: { background: '#00000000', foreground: '#00ff00' },
            fontFamily: 'monospace',
            cursorBlink: true
        });

        term.open(document.getElementById('terminal'));

        const getBrowserName = () => {
            const ua = navigator.userAgent;
            if (ua.includes("Firefox/")) return "Firefox";
            if (ua.includes("Edg/")) return "Edge";
            if (ua.includes("Chrome/")) return "Chrome";
            if (ua.includes("Safari/") && !ua.includes("Chrome/")) return "Safari";
            return "Unknown";
        };

        const commands = {
            help: "Available commands: help, about, weofetch, clear",
            about: "Webtop Terminal v2.0 [xterm.js]",
            clear: () => { term.clear(); return ""; },
            weofetch: () => {
                return [
                    `System: Webtop <${getBrowserName()}>`,
                    `CPU:    ${navigator.hardwareConcurrency || "Unknown"}`,
                    `RAM:    ${navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Unknown"}`,
                    `Screen: ${window.innerWidth}x${window.innerHeight} @ ${window.devicePixelRatio}x`
                ].join('\r\n');
            },
        };

        term.write('> ');

        let currentInput = '';
        term.onData(e => {
            if (e === '\r') {
                term.writeln('');
                const cmd = currentInput.trim();
                if (commands[cmd]) {
                    const response = typeof commands[cmd] === 'function' ? commands[cmd]() : commands[cmd];
                    if (response) term.writeln(response);
                } else if (cmd !== "") {
                    term.writeln(`'${cmd}' is not recognized.`);
                }
                currentInput = '';
                term.write('> ');
            } else if (e === '\u007F') {
                if (currentInput.length > 0) {
                    term.write('\b \b');
                    currentInput = currentInput.slice(0, -1);
                }
            } else {
                term.write(e);
                currentInput += e;
            }
        });
    </script>
</body>

</html>
