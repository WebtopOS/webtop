<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webtop Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    
    <style>
        body {
            height: 100vh;
            margin: 0;
            background: transparent; 
        }

        #terminal {
            width: 100%;
            height: 100%;
        }

        .xterm, .xterm-viewport, .xterm-screen {
            background-color: transparent !important;
        }
    </style>
</head>
<body>

    <div id="terminal"></div>

    <script>
        const term = new Terminal({
            allowTransparency: true,
            theme: {
                background: '#00000000',
                foreground: '#00ff00'
            },
            fontFamily: 'monospace',
            fontSize: 14,
            cursorBlink: true
        });

        term.open(document.getElementById('terminal'));
        
        document.querySelector('.xterm-rows').style.padding = '12px';

        term.writeln('Webtop Terminal [Transparent Mode]');
        term.write('> ');

        let currentInput = '';
        term.onData(e => {
            if (e === '\r') {
                term.writeln('');
                term.write('> ');
                currentInput = '';
            } else if (e === '\u007F') {
                if (currentInput.length > 0) {
                    term.write('\b \b');
                    currentInput = currentInput.slice(0, -1);
                }
            } else {
                term.write(e);
                currentInput += e;
            }
        });
    </script>
</body>
</html>
