<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Media Player Pro</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: transparent !important;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }

        .control-bar {
            width: 100%;
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        #playlist {
            list-style: none;
            padding: 0;
        }

        .track-item {
            padding: 10px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 10px;
        }

        #file-input {
            display: none;
        }
    </style>
</head>

<body>

    <main>
        <ul id="playlist"></ul>
        <input type="file" id="file-input" accept="audio/*">
    </main>

    <footer class="control-bar">
        <div class="controls-group">
            <button id="prev"><i data-lucide="skip-back"></i></button>
            <button id="play-pause"><i data-lucide="play"></i></button>
            <button id="next"><i data-lucide="skip-forward"></i></button>
        </div>
        <div class="controls-group">
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1">
            <button id="shuffle"><i data-lucide="shuffle"></i></button>
            <button id="repeat"><i data-lucide="repeat"></i></button>
            <button onclick="document.getElementById('file-input').click()"><i data-lucide="plus"></i></button>
        </div>
    </footer>

    <audio id="audio-player"></audio>

    <script>
        let db;
        const request = indexedDB.open("MusicLibrary", 1);
        request.onupgradeneeded = (e) => { e.target.result.createObjectStore("songs", { keyPath: "id" }); };
        request.onsuccess = (e) => { db = e.target.result; renderPlaylist(); };

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            jsmediatags.read(file, {
                onSuccess: (tag) => {
                    const song = { id: Date.now(), name: file.name, title: tag.tags.title || file.name, artist: tag.tags.artist || "Unknown", file: file };
                    db.transaction(["songs"], "readwrite").objectStore("songs").add(song).onsuccess = renderPlaylist;
                }
            });
        });

        function renderPlaylist() {
            const list = document.getElementById('playlist');
            list.innerHTML = '';
            db.transaction("songs").objectStore("songs").getAll().onsuccess = (e) => {
                e.target.result.forEach(song => {
                    const li = document.createElement('li');
                    li.className = 'track-item';
                    li.innerHTML = `<span>${song.title} - ${song.artist}</span>`;
                    li.onclick = () => { audio.src = URL.createObjectURL(song.file); audio.play(); };
                    list.appendChild(li);
                });
            };
        }
    </script>
</body>

</html>
