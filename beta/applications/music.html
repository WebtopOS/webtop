<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Media Player Pro</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: transparent !important;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }

        .control-bar {
            width: 100%;
            background: rgba(17, 17, 17, 0.7);
            padding: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        main {
            flex: 1;
            padding: 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        #playlist {
            list-style: none;
            padding: 0;
            width: 100%;
        }

        .track-item {
            padding: 15px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background 0.2s;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .album-art-thumb {
            width: 80px;
            height: 80px;
            background: #333;
            border-radius: 4px;
            object-fit: cover;
        }

        .controls-group {
            display: flex;
            gap: 3px;
            align-items: center;
        }

        button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #file-input {
            display: none;
        }
    </style>
</head>

<body>

    <main>
        <ul id="playlist"></ul>
    </main>

    <footer class="control-bar" style="display: flex; flex-direction: column; gap: 8px; padding: 10px;">
        <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #888; width: 100%;">
            <span id="current-time">0:00</span>
            <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1" style="flex: 1; cursor: pointer;">
            <span id="total-duration">0:00</span>
        </div>

        <div class="controls-row"
            style="display: flex; justify-content: space-between; align-items: center; width: 100%;">

            <div class="controls-group" style="display: flex; gap: 3px; flex: 1; justify-content: flex-start;">
                <button id="prev"><i data-lucide="skip-back"></i></button>
                <button id="play-pause"><i data-lucide="play"></i></button>
                <button id="next"><i data-lucide="skip-forward"></i></button>
            </div>

            <div id="track-info"
                style="font-size: 0.85em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: center; flex: 2; padding: 0 10px;">
                <div id="display-title">No track playing</div>
                <div id="display-artist" style="color: #aaa;">-</div>
            </div>

            <div class="controls-group" style="display: flex; gap: 3px; flex: 1; justify-content: flex-end;">
                <button id="shuffle"><i data-lucide="shuffle"></i></button>
                <button id="repeat"><i data-lucide="repeat"></i></button>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1" style="width: 80px;">
                <button onclick="document.getElementById('file-input').click()"><i data-lucide="plus"></i></button>
            </div>
        </div>
    </footer>

    <input type="file" id="file-input" accept="audio/*">
    <audio id="audio-player"></audio>

    <script>
        const seekBar = document.getElementById('seek-bar');
        const curTimeEl = document.getElementById('current-time');
        const durTimeEl = document.getElementById('total-duration');
        const displayTitle = document.getElementById('display-title');
        const displayArtist = document.getElementById('display-artist');

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' + s : s}`;
        }
        let db, currentIndex = 0, songsList = [], isShuffle = false, isRepeat = false;
        const audio = document.getElementById('audio-player');
        const playPauseBtn = document.getElementById('play-pause');

        const request = indexedDB.open("MusicLibrary", 1);
        request.onupgradeneeded = (e) => { e.target.result.createObjectStore("songs", { keyPath: "id" }); };
        request.onsuccess = (e) => { db = e.target.result; renderPlaylist(); };

        function playTrack(index) {
            if (index < 0 || index >= songsList.length) return;
            currentIndex = index;
            displayTitle.innerText = songsList[currentIndex].title;
            displayArtist.innerText = songsList[currentIndex].artist;
            audio.src = URL.createObjectURL(songsList[currentIndex].file);
            audio.play();
            playPauseBtn.innerHTML = '<i data-lucide="pause"></i>';
            lucide.createIcons();
        }

        document.getElementById('play-pause').onclick = () => {
            if (audio.paused) { audio.play(); playPauseBtn.innerHTML = '<i data-lucide="pause"></i>'; }
            else { audio.pause(); playPauseBtn.innerHTML = '<i data-lucide="play"></i>'; }
            lucide.createIcons();
        };

        document.getElementById('next').onclick = () => {
            let next = isShuffle ? Math.floor(Math.random() * songsList.length) : currentIndex + 1;
            playTrack(next % songsList.length);
        };

        document.getElementById('prev').onclick = () => playTrack((currentIndex - 1 + songsList.length) % songsList.length);
        document.getElementById('shuffle').onclick = () => { isShuffle = !isShuffle; document.getElementById('shuffle').style.color = isShuffle ? '#6366f1' : 'white'; };
        document.getElementById('repeat').onclick = () => { isRepeat = !isRepeat; document.getElementById('repeat').style.color = isRepeat ? '#6366f1' : 'white'; };
        document.getElementById('volume-slider').oninput = (e) => audio.volume = e.target.value;

        audio.onended = () => { if (isRepeat) audio.play(); else document.getElementById('next').click(); };

        document.getElementById('file-input').onchange = (e) => {
            const file = e.target.files[0];
            window.jsmediatags.read(file, {
                onSuccess: (tag) => {
                    let art = null;
                    const picture = tag.tags.picture;

                    if (picture && picture.data) {
                        let base64 = "";
                        const data = picture.data;
                        for (let i = 0; i < data.length; i++) {
                            base64 += String.fromCharCode(data[i]);
                        }
                        art = `data:${picture.format || 'image/jpeg'};base64,${window.btoa(base64)}`;
                    }

                    const song = {
                        id: Date.now(),
                        title: tag.tags.title || file.name,
                        artist: tag.tags.artist || "Unknown",
                        art: art,
                        file: file
                    };

                    db.transaction(["songs"], "readwrite").objectStore("songs").add(song).onsuccess = renderPlaylist;
                }
            });
        };

        function renderPlaylist() {
            const list = document.getElementById('playlist');
            list.innerHTML = '';
            db.transaction("songs").objectStore("songs").getAll().onsuccess = (e) => {
                songsList = e.target.result;
                songsList.forEach((song, index) => {
                    const li = document.createElement('li');
                    li.className = 'track-item';
                    li.innerHTML = `
    <img class="album-art-thumb" src="${song.art || 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='}">
    <div style="display: flex; flex-direction: column;">
        <span>${song.title}</span>
        <small>${song.artist}</small>
    </div>
`;
                    li.onclick = () => playTrack(index);
                    list.appendChild(li);
                });
            };
        }
        audio.ontimeupdate = () => {
            if (audio.duration) {
                seekBar.value = (audio.currentTime / audio.duration) * 100;
                curTimeEl.innerText = formatTime(audio.currentTime);
                durTimeEl.innerText = formatTime(audio.duration);
            }
        };

        seekBar.oninput = () => {
            audio.currentTime = audio.duration * (seekBar.value / 100);
        };
        lucide.createIcons();
    </script>
</body>

</html>
