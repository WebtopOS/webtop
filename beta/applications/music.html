<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Media Player Pro</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: transparent !important;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }

        .control-bar {
            width: 100%;
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #playlist {
            list-style: none;
            padding: 0;
            width: 100%;
            max-width: 600px;
        }

        .track-item {
            padding: 15px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .album-art-thumb {
            width: 50px;
            height: 50px;
            background: #333;
            border-radius: 4px;
            object-fit: cover;
        }

        .controls-group {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 10px;
        }

        #file-input {
            display: none;
        }
    </style>
</head>

<body>

    <main>
        <ul id="playlist"></ul>
    </main>

    <footer class="control-bar">
        <div class="controls-group">
            <button id="prev"><i data-lucide="skip-back"></i></button>
            <button id="play-pause"><i data-lucide="play"></i></button>
            <button id="next"><i data-lucide="skip-forward"></i></button>
        </div>
        <div class="controls-group">
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1">
            <button id="shuffle"><i data-lucide="shuffle"></i></button>
            <button id="repeat"><i data-lucide="repeat"></i></button>
            <button onclick="document.getElementById('file-input').click()"><i data-lucide="plus"></i></button>
        </div>
    </footer>

    <input type="file" id="file-input" accept="audio/*">
    <audio id="audio-player"></audio>

    <script>
        lucide.createIcons();
        let db;
        const audio = document.getElementById('audio-player');
        const playPauseBtn = document.getElementById('play-pause');
        const volumeSlider = document.getElementById('volume-slider');
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        const request = indexedDB.open("MusicLibrary", 1);
        request.onupgradeneeded = (e) => { e.target.result.createObjectStore("songs", { keyPath: "id" }); };
        request.onsuccess = (e) => { db = e.target.result; renderPlaylist(); };

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            window.jsmediatags.read(file, {
                onSuccess: (tag) => {
                    let base64String = "";
                    if (tag.tags.picture) {
                        const { data, format } = tag.tags.picture;
                        data.forEach(byte => base64String += String.fromCharCode(byte));
                        base64String = `data:${format};base64,${window.btoa(base64String)}`;
                    }
                    const song = { id: Date.now(), name: file.name, title: tag.tags.title || file.name, artist: tag.tags.artist || "Unknown", art: base64String, file: file };
                    db.transaction(["songs"], "readwrite").objectStore("songs").add(song).onsuccess = renderPlaylist;
                }
            });
        });

        function renderPlaylist() {
            const list = document.getElementById('playlist');
            list.innerHTML = '';
            db.transaction("songs").objectStore("songs").getAll().onsuccess = (e) => {
                e.target.result.forEach(song => {
                    const li = document.createElement('li');
                    li.className = 'track-item';
                    li.innerHTML = `
                    <img class="album-art-thumb" src="${song.art || 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='}">
                    <span>${song.title} - ${song.artist}</span>
                `;
                    li.onclick = () => {
                        audio.src = URL.createObjectURL(song.file);
                        audio.play();
                        playPauseBtn.innerHTML = '<i data-lucide="pause"></i>';
                        lucide.createIcons();
                    };
                    list.appendChild(li);
                });
                lucide.createIcons();
            };
        }

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) { audio.play(); playPauseBtn.innerHTML = '<i data-lucide="pause"></i>'; }
            else { audio.pause(); playPauseBtn.innerHTML = '<i data-lucide="play"></i>'; }
            lucide.createIcons();
        });
    </script>
</body>

</html>
