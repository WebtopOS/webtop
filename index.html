<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webtop Beta</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="desktop">
        <div class="widget" style="display:none;">
            <h3>Kernel Metadata</h3>
            <p>Timezone: UTC-4<br>Format: ISO-8601<br>Status: Nominal</p>
        </div>
        <div class="desktop-icons">
      <div class="desktop-icon" data-title="Terminal" data-url="./applications/term.html" data-width="782" data-height="472">
        <img src="./icons/term.png"/>
      </div>
      <div class="desktop-icon" data-title="Webtop Code" data-url="./applications/WTC.html" data-width="782" data-height="472">
        <img src="./icons/wtc.svg"/>
      </div>
      <div class="desktop-icon" data-title="Notepad" data-url="./applications/note/index.html" data-width="782" data-height="472">
        <img src="./icons/txt.svg"/>
      </div>
        </div>

    <div id="start-menu" class="start-menu" hidden>
        <div class="app-grid">
      <div class="desktop-icon" data-title="Terminal" data-url="./applications/term.html" data-width="800" data-height="500">
        <img src="./icons/term.png"/>
      </div>
      <div class="desktop-icon" data-title="Webtop Code" data-url="./applications/WTC.html" data-width="800" data-height="500">
        <img src="./icons/wtc.svg"/>
      </div>
      <div class="desktop-icon" data-title="Notepad" data-url="./applications/note/index.html" data-width="800" data-height="500">
        <img src="./icons/txt.svg"/>
      </div>
      <div class="desktop-icon" data-title="PenguinMod" data-url="https://studio.penguinmod.com/editor" data-width="1024" data-height="700">
        <img src="https://favicon.im/penguinmod.com?larger=true"/>
      </div>
      <div class="desktop-icon" data-title="MistWarp" data-url="https://warp.mistium.com/editor?extension=https://WebtopOS.github.io/webtop/applications/mw/theme.js" data-width="1024" data-height="700">
        <img src="./icons/mw.svg"/>
      </div>
      <div class="desktop-icon" data-title="BlockBench" data-url="https://web.blockbench.net" data-width="1024" data-height="700">
        <img src="https://favicon.im/web.blockbench.net"/>
      </div>
      <div class="desktop-icon" data-title="Piskel" data-url="./applications/piskel/" data-width="1024" data-height="700">
        <img src="./applications/piskel/logo.png"/>
      </div>
      <div class="desktop-icon" data-title="Minecraft Classic" data-url="https://classic.minecraft.net" data-width="782" data-height="472">
        <img src="./icons/minecraft.png"/>
      </div>
      <div class="desktop-icon" data-title="Mcraft" data-url="https://mcraft.fun" data-width="854" data-height="519">
        <img src="https://favicon.im/mcraft.fun?larger=true"/>
      </div>
      <div class="desktop-icon" data-title="Doom" data-url="./applications/doom/" data-width="640" data-height="406">
        <img src="./icons/doom.svg"/>
      </div>
      <div class="desktop-icon" data-title="originChats" data-url="https://originchats.com/app" data-width="1024" data-height="700">
        <img src="https://favicon.im/originchats.com?larger=true"/>
      </div>
        </div>

        <div class="search-section">
            <div class="search-container">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" class="search-input" placeholder="Search...">
            </div>

            <button class="task-button settings-btn" id="settings">
                <i data-lucide="sliders-horizontal"></i>
            </button>
        </div>
    </div>

    <div class="taskbar">
        <div class="shelf-start">
            <div class="task-button" id="apps-menu"><i data-lucide="grip"></i></div>
        </div>

        <div class="shelf-center" id="task-list">
        </div>

        <div class="shelf-end">
            <div class="status-group">
                <i data-lucide="wifi" size="16"></i>
                <i data-lucide="battery-full" size="16"></i>
                <div class="time-module">
                    <span id="date">00-00</span>
                    <span id="clock">00:00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function updateDateTime() {
            const now = new Date();

            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hh}:${mm}`;

            const yyyy = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            document.getElementById('date').textContent = `${month}-${dd}`;
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();

        const trigger = document.getElementById('apps-menu');
        const menu = document.getElementById('start-menu');

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();

            const isHidden = menu.hasAttribute('hidden');

            if (isHidden) {
                menu.removeAttribute('hidden');
                setTimeout(() => {
                    document.querySelector('.search-input')?.focus();
                }, 50);
            } else {
                menu.setAttribute('hidden', '');
            }
        });

        document.addEventListener('click', (e) => {
            if (!menu.contains(e.target) && e.target !== trigger) {
                menu.setAttribute('hidden', '');
            }
        });
    </script>

    <div id="windows"></div>
    </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
