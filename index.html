<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webtop Beta</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="desktop">
        <div class="widget" style="display:none;">
            <h3>Kernel Metadata</h3>
            <p>Timezone: UTC-4<br>Format: ISO-8601<br>Status: Nominal</p>
        </div>
        <div class="desktop-icons">
            <div class="desktop-icon">
                <i data-lucide="hard-drive"></i>
                <span>Root</span>
            </div>
            <div class="desktop-icon">
                <i data-lucide="folder-kanban"></i>
                <span>Projects</span>
            </div>
            <div class="desktop-icon">
                <i data-lucide="file"></i>
                <span>file.txt</span>
            </div>
            <div class="desktop-icon">
                <i data-lucide="trash-2"></i>
                <span>Trash</span>
            </div>
        </div>

    <div id="start-menu" class="start-menu" hidden>
        <div class="app-grid">
            <div class="desktop-icon">
                <i data-lucide="hard-drive"></i>
                <span>Root</span>
            </div>
            <div class="desktop-icon">
                <i data-lucide="folder-kanban"></i>
                <span>Projects</span>
            </div>
            <div class="desktop-icon">
                <i data-lucide="file"></i>
                <span>file.txt</span>
            </div>
            <div class="desktop-icon">
                <i data-lucide="trash-2"></i>
                <span>Trash</span>
            </div>
        </div>

        <div class="search-section">
            <div class="search-container">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" class="search-input" placeholder="Search...">
            </div>

            <button class="task-button settings-btn" id="settings">
                <i data-lucide="sliders-horizontal"></i>
            </button>
        </div>
    </div>

    <div class="taskbar">
        <div class="shelf-start">
            <div class="task-button" id="apps-menu"><i data-lucide="grip"></i></div>
        </div>

        <div class="shelf-center" id="task-list">
            <button class="task-button"><i data-lucide="globe"></i><span class="app-label">Browser</span></button>
            <button class="task-button"><i data-lucide="terminal"></i><span class="app-label">Terminal</span></button>
            <button class="task-button"><i data-lucide="folder"></i><span class="app-label">Files</span></button>
            <button class="task-button"><i data-lucide="command"></i><span class="app-label">Command</span></button>
        </div>

        <div class="shelf-end">
            <div class="status-group">
                <i data-lucide="wifi" size="16"></i>
                <i data-lucide="battery-full" size="16"></i>
                <div class="time-module">
                    <span id="date">00-00</span>
                    <span id="clock">00:00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function updateDateTime() {
            const now = new Date();

            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hh}:${mm}`;

            const yyyy = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            document.getElementById('date').textContent = `${month}-${dd}`;
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();

        const trigger = document.getElementById('apps-menu');
        const menu = document.getElementById('start-menu');

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();

            const isHidden = menu.hasAttribute('hidden');

            if (isHidden) {
                menu.removeAttribute('hidden');
                setTimeout(() => {
                    document.querySelector('.search-input')?.focus();
                }, 50);
            } else {
                menu.setAttribute('hidden', '');
            }
        });

        document.addEventListener('click', (e) => {
            if (!menu.contains(e.target) && e.target !== trigger) {
                menu.setAttribute('hidden', '');
            }
        });
    </script>

    <div id="windows"></div>
    </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
